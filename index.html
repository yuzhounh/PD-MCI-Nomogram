<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>PD-MCI Risk Assessment System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.71.0/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.71.0/build/stlite.js"></script>
    <script>
      stlite.mount(
        {
          requirements: ["numpy", "pandas", "plotly"],
          entrypoint: "webapp_6.py",
          files: {
            "webapp_6.py": `
import streamlit as st
import numpy as np
import plotly.graph_objects as go
import pandas as pd

# ---------------- Core Model Parameters ----------------
MODEL = {
    "coef": [0.61999256, -0.13608411, 0.02756812, 0.09713671, 0.00337871, 0.26305601, 0.21096589, 0.01855644],
    "intercept": -1.4159772,
    "names": ["Sex", "Education Years (EDUCYRS)", "Sleep Scale (RBDSQ)", "Depression Scale (GDS)", 
              "Autonomic Scale (SCOPA-AUT)", "H&Y Stage", "Gait Disorder (PIGD)", "Motor Score (UPDRS-III)"],
    "thr": {"default": 0.5, "f1": 0.2114, "youden": 0.1909}
}

def sigmoid(x):
    return 1 / (1 + np.exp(-x))

# ---------------- Page Configuration ----------------
st.set_page_config(page_title="PD-MCI Risk Assessment System", layout="wide")

st.title("🧠 Parkinson's Disease Mild Cognitive Impairment (PD-MCI) Risk Assessment")
st.markdown("Real-time prediction and clinical analysis tool based on logistic regression model (PPMI cohort study).")

# ---------------- Sidebar: Data Input ----------------
st.sidebar.header("📋 Patient Clinical Indicators")

with st.sidebar:
    sex = st.selectbox("Sex", options=[0, 1], format_func=lambda x: "Male (1)" if x == 1 else "Female (0)")
    educ = st.number_input("Education Years (EDUCYRS)", min_value=0, max_value=30, value=12)
    rbdsq = st.number_input("Sleep Scale (RBDSQ)", min_value=0.0, max_value=13.0, value=5.0, step=0.5)
    gds = st.number_input("Depression Scale (GDS)", min_value=0.0, max_value=15.0, value=4.0, step=0.5)
    scopa = st.number_input("Autonomic Scale (SCOPA-AUT)", min_value=0.0, max_value=53.0, value=15.0, step=1.0)
    hy = st.selectbox("Hoehn & Yahr Stage (H&Y)", options=[0, 1, 2, 3, 4, 5], index=2)
    pigd = st.number_input("PIGD Score", min_value=0.0, max_value=4.0, value=1.0, step=0.04)
    updrs3 = st.number_input("UPDRS-III Motor Score", min_value=0, max_value=96, value=25)

# ---------------- Calculation Logic ----------------
inputs = np.array([sex, educ, rbdsq, gds, scopa, hy, pigd, updrs3])
logit = np.dot(MODEL["coef"], inputs) + MODEL["intercept"]
prob = sigmoid(logit)
contributions = MODEL["coef"] * inputs

# ---------------- Main Interface Layout ----------------
col1, col2 = st.columns([1, 1])

with col1:
    st.subheader("📊 Risk Prediction Results")
    
    # Complete Gauge chart with color segments
    fig_gauge = go.Figure(go.Indicator(
        mode = "gauge+number",
        value = prob * 100,
        domain = {'x': [0, 1], 'y': [0, 1]},
        title = {'text': "PD-MCI Probability (%)", 'font': {'size': 24}},
        gauge = {
            'axis': {'range': [0, 100], 'tickwidth': 1},
            'bar': {'color': "#1f77b4"},
            'steps': [
                {'range': [0, MODEL["thr"]["youden"]*100], 'color': "#e8f5e9"},
                {'range': [MODEL["thr"]["youden"]*100, 50], 'color': "#fff3e0"},
                {'range': [50, 100], 'color': "#ffebee"}
            ],
            'threshold': {
                'line': {'color': "red", 'width': 4},
                'thickness': 0.75,
                'value': MODEL["thr"]["youden"]*100
            }
        }
    ))
    fig_gauge.update_layout(height=350, margin=dict(l=20, r=20, t=50, b=20))
    st.plotly_chart(fig_gauge, use_container_width=True)

    # Conditional judgment text
    if prob >= MODEL["thr"]["default"]:
        st.error(f"**Diagnosis Suggestion: High Risk (Positive)** \\n\\nCurrent probability ({prob:.1%}) exceeds the standard threshold (50%).")
    elif prob >= MODEL["thr"]["youden"]:
        st.warning(f"**Diagnosis Suggestion: Potential Risk (Warning)** \\n\\nProbability ({prob:.1%}) exceeds the Youden index optimal threshold ({MODEL['thr']['youden']:.1%}), close monitoring recommended.")
    else:
        st.success(f"**Diagnosis Suggestion: Low Risk (Negative)** \\n\\nCurrent cognitive status predicted as normal.")

with col2:
    st.subheader("🔍 Feature Contribution Analysis")
    
    # Contribution analysis chart (sorted by absolute value, color-coded by positive/negative)
    df_contrib = pd.DataFrame({
        "Feature": MODEL["names"],
        "Contribution": contributions
    })
    df_contrib["Absolute Value"] = df_contrib["Contribution"].abs()
    df_contrib = df_contrib.sort_values(by="Absolute Value", ascending=True)
    
    fig_contrib = go.Figure()
    fig_contrib.add_trace(go.Bar(
        y=df_contrib["Feature"],
        x=df_contrib["Absolute Value"],
        orientation='h',
        marker_color=['#ef5350' if x > 0 else '#66bb6a' for x in df_contrib["Contribution"]],
        text=[f"{v:+.3f}" for v in df_contrib["Contribution"]],
        textposition='outside'
    ))
    fig_contrib.update_layout(
        title="Impact of Each Indicator (Red: Increase Risk, Green: Decrease)",
        xaxis_title="Absolute Contribution Score",
        height=400,
        margin=dict(l=20, r=20, t=40, b=20)
    )
    st.plotly_chart(fig_contrib, use_container_width=True)

# ---------------- Clinical Analysis Report Section ----------------
st.divider()
st.subheader("📝 Clinical Brief Analysis")

col_a, col_b = st.columns(2)

with col_a:
    st.markdown(f"""
    **1. Key Risk Driving Factors:**
    * **Main Positive Factors:** {df_contrib.iloc[-1]['Feature']} and {df_contrib.iloc[-2]['Feature']} contribute most to this patient's risk score.
    * **Educational Background:** The coefficient for education years is negative ({-MODEL['coef'][1]:.2f}), meaning higher education is a significant protective factor.
    """)

with col_b:
    st.markdown(f"""
    **2. Threshold Reference:**
    * **Standard Threshold (0.50):** Used for general classification.
    * **Youden Threshold ({MODEL['thr']['youden']:.3f}):** Balance point, suitable for early screening.
    * **F1 Threshold ({MODEL['thr']['f1']:.3f}):** Optimized for imbalanced samples.
    """)

st.info("Note: This tool is for research reference only, not as the sole diagnostic basis.")
`,
          },
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
